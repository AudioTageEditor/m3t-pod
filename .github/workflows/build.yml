# File: .github/workflows/build.yml
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v5

      - name: Ekstrak ZIP proyek (bila diunggah sebagai ZIP)
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ]; then
            echo "Proyek sudah berupa file biasa, ZIP diabaikan."
            exit 0
          fi
          shopt -s nullglob nocaseglob
          zips=(*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Harus ada settings.gradle.kts atau tepat satu file ZIP di folder utama (ditemukan ${#zips[@]} ZIP)."
            exit 1
          fi
          target="$(mktemp -d)"
          unzip -q "${zips[0]}" -d "$target"
          found="$(find "$target" -name settings.gradle.kts -not -path '*/__MACOSX/*' -print -quit)"
          if [ -z "$found" ]; then
            echo "::error::settings.gradle.kts tidak ada di dalam ${zips[0]}."
            exit 1
          fi
          cp -a "$(dirname "$found")/." .
          echo "ZIP ${zips[0]} diekstrak."

      - name: Cari dan perbaiki AndroidManifest.xml
        run: |
          set -euo pipefail
          echo "== Daftar file proyek =="
          find . -path ./.git -prune -o -type f -not -path './app/build/*' -print | sort | head -150
          want="app/src/main/AndroidManifest.xml"
          if [ -f "$want" ]; then
            echo "Manifest sudah di tempat yang benar."
            exit 0
          fi
          found="$(find . -path ./.git -prune -o -type f -iname 'androidmanifest.xml*' -print | head -n 1)"
          if [ -z "$found" ]; then
            echo "::error::AndroidManifest.xml tidak ada sama sekali di repo. Upload file itu ke app/src/main/."
            exit 1
          fi
          echo "::warning::Manifest ada di '$found', dipindahkan ke $want"
          mkdir -p app/src/main
          cp "$found" "$want"

      - name: Periksa kelengkapan file
        run: |
          set -euo pipefail
          base=app/src/main/java/com/tagbardroid/app
          missing=0
          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            "$base/MainActivity.kt" \
            "$base/ui/MainScreen.kt" \
            "$base/engine/TagAndReplayGainEngine.kt" \
            "$base/library/FileAndPlaylistManager.kt"
          do
            if [ ! -f "$f" ]; then
              echo "::error::File belum ada atau salah tempat: $f"
              missing=1
            fi
          done
          exit "$missing"

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Build APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Ambil nama APK (nama + versi)
        id: apk
        run: |
          set -euo pipefail
          f="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f" .apk)" >> "$GITHUB_OUTPUT"
          echo "APK: $f"

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Terbitkan APK di Releases
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "${{ steps.apk.outputs.name }}" \
            --notes "APK debug dari commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest
